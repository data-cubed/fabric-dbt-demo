version: 2

# Complete table schemas (with constraints and data_tests)
# can be generated using dbt-codegen generate_model_schemas
# documentation: https://hub.getdbt.com/dbt-labs/codegen/latest/

models:
  # Dim Customer
  - name: dim_customer
    description: "Customer dimension table"
    # required to enforce primary key constraints
    config:
      contract: {enforced: true}
    columns:
      - name: CustomerKey
        description: "The primary key for the dim_customer table"
        data_type: int
        data_tests:
          - unique
        constraints:
          - type: primary_key
      - name: EmailAddress
        description: "Email address"
        data_type: string
      - name: FirstName
        description: "First name"
        data_type: string
      - name: LastName
        description: "Last name"
        data_type: string
      - name: MiddleName
        description: "Middle name"
        data_type: string
      - name: NameStyle
        description: "Name style (boolean)"
        data_type: boolean
      - name: Phone
        description: "Phone number"
        data_type: string
      - name: Suffix
        description: "Name suffix"
        data_type: string
      - name: Title
        description: "Title"
        data_type: string


  # Dim Product
  - name: dim_product
    description: "Product dimension table"
    # required to enforce primary key constraints
    config:
      contract: {enforced: true}
    columns:
      - name: ProductKey
        description: "The primary key for the dim_product table"
        data_type: int
        data_tests:
          - unique
        constraints:
          - type: primary_key
      - name: Color
        data_type: string
      - name: ListPrice
        data_type: decimal
      - name: ProductCategoryName
        data_type: string
      - name: ProductDescription
        data_type: string
      - name: ProductSubcategoryName
        data_type: string
      - name: ProductName
        data_type: string
      - name: Size
        data_type: string

  # Fact Sales
  - name: fact_sales
    description: "Sales fact table"
    # required to enforce primary key constraints
    config:
      contract: {enforced: true}
    columns:
      - name: SalesOrderNumber
        description: "The primary key for the fact_sales table"
        data_type: int
        data_tests:
          - unique
        constraints:
          - type: primary_key
      - name: SalesOrderLineNumber
        description: ""
        data_type: int
      - name: ProductKey
        description: "The foreign key to the dim_product table"
        data_type: int
        constraints:
          - type: foreign_key
            to: ref('dim_product')
            to_columns: [ProductKey]
      - name: CustomerKey
        description: "The foreign key to the dim_customer table"
        data_type: int
        constraints:
          - type: foreign_key
            to: ref('dim_customer')
            to_columns: [CustomerKey]
      - name: OrderQuantity
        data_type: smallint
      - name: SalesAmount
        data_type: decimal(19,4)
      - name: TaxAmt
        data_type: decimal(19,4)
        description: "Tax amount for the order"
      - name: UnitPrice
        data_type: decimal(19,4)
        description: "Unit price of the product"
      - name: UnitPriceDiscountPct
        description: "Discount percentage applied to the unit price"
        data_type: decimal(19,4)
      - name: OrderDate
        description: "Date the order was placed"
        data_type: timestamp
      - name: DueDate
        description: "Date the order is due"
        data_type: timestamp
      - name: ShipDate
        description: "Date the order was shipped"
        data_type: timestamp