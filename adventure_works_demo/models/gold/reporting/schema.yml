version: 2

models:
  # Dim Customer
  - name: vw_dim_customer
    description: "Customer dimension table"
    columns:
      - name: CustomerKey
        description: "The primary key for the vw_dim_customer table"
        data_type: int
        data_tests:
          - unique
          - not_null

  # Dim Product
  - name: vw_dim_product
    description: "Product dimension table"
    columns:
      - name: ProductKey
        description: "The primary key for the vw_dim_product table"
        data_tests:
          - unique
          - not_null
          
  # Fact Sales
  - name: vw_fact_sales
    description: "Sales fact table"
    columns:
      - name: SalesOrderNumber
        description: "The is for the sales order"
        data_tests:
          - not_null
      - name: SalesOrderLineNumber
        description: "The line number for the sales order"
      - name: ProductKey
        description: "The foreign key to the vw_dim_product table"
      - name: CustomerKey
        description: "The foreign key to the vw_dim_customer table"
      - name: OrderDate
        description: "Date the order was placed"
        data_type: timestamp
      - name: DueDate
        description: "Date the order is due"
        data_type: timestamp
      - name: ShipDate
        description: "Date the order was shipped"
        data_type: timestamp
      - name: TaxAmt
        data_type: decimal(5,2)
        description: "Tax amount for the order"
      - name: SalesAmount
        data_type: decimal(6,2)
        description: "Total amount due for the order"
      - name: UnitPrice
        data_type: decimal(6,2)
        description: "Unit price of the product"
      - name: UnitPriceDiscountPct
        description: "Discount applied to the unit price"
        data_type: double