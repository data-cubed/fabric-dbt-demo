
version: 2

models:
# Customer
  - name: customer
    description: Customer table
    columns:
      - name: CustomerKey
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
        constraints:
          - type: primary_key
  

  # Product
  - name: product
    description: Product table
    columns:
      - name: ProductKey
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
        constraints:
          - type: primary_key
      - name: ProductSubcategoryKey
        description: "The foreign key to the product subcategory table"
        constraints:
          - type: foreign_key
            to: ref('product_subcategory')
            to_columns: [ProductSubcategoryKey]
  
  # Product Subategory
  - name: product_subcategory
    description: Product Subcategory table
    columns:
      - name: ProductSubcategoryKey
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
        constraints:
          - type: primary_key

  # Product Category
  - name: product_category
    description: Product Category table
    columns:
      - name: ProductCategoryKey
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
        constraints:
          - type: primary_key

  # Sales Order Detail
  - name: internet_sales
    description: Sales Order Detail table
    columns:
      - name: SalesOrderNumber
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
        constraints:
          - type: primary_key